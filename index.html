<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Assegnazioni S-89 → WhatsApp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
body { margin: 0; padding: 12px; }
.card { max-width: 600px; margin: auto; background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
h1 { font-size: 1.3rem; margin: 0 0 12px; text-align: center; color: #0f5132; }
.section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 6px; }
input[type=file] { width: 100%; box-sizing: border-box; font-size: 0.9rem; }
.status { font-size: 0.85rem; color: #475569; margin-top: 8px; font-weight: 500; }
.item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-top: 12px; background: #fff; }
.item-header { font-weight: bold; font-size: 1rem; color: #1e293b; }
.item-sub { font-size: 0.85rem; color: #64748b; margin: 4px 0 8px; }
.btn { display: inline-block; width: 100%; box-sizing: border-box; border: 0; border-radius: 10px; padding: 12px; background: #25d366; color: #fff; font-weight: bold; font-size: 0.95rem; text-align: center; text-decoration: none; margin-top: 6px; cursor: pointer; }
.btn-secondary { background: #0284c7; margin-top: 4px; }
.btn:disabled { opacity: 0.5; }
.preview-img { width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid #cbd5e1; }
</style>
</head>
<body>
<main class="card">
  <h1>📋 Assegnazioni → WhatsApp</h1>
  
  <div class="section">
    <label>1. Seleziona il PDF Assegnazioni (S-89.pdf)</label>
    <input id="pdfFile" type="file" accept="application/pdf">
  </div>

  <div class="section">
    <label>2. Seleziona la Rubrica (Rubrica.vcf)</label>
    <input id="vcfFile" type="file" accept=".vcf">
  </div>

  <div id="status" class="status">Carica i file per iniziare.</div>

  <div id="results"></div>
</main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let rubrica = {};

const $ = id => document.getElementById(id);
function say(msg) { $('status').textContent = msg; }

// Caricamento del file VCF
$('vcfFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  rubrica = parseVCF(text);
  say(`Rubrica caricata: ${Object.keys(rubrica).length} contatti trovati.`);
  checkAndProcess();
});

// Caricamento del PDF
$('pdfFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const arrayBuffer = await file.arrayBuffer();
  pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  say(`PDF caricato: ${pdfDoc.numPages} pagine.`);
  checkAndProcess();
});

function parseVCF(vcfText) {
  const map = {};
  const vcards = vcfText.split('BEGIN:VCARD');
  vcards.forEach(card => {
    let name = '', tel = '';
    const matchN = card.match(/N(?:ame)?:([^;\n]+);([^;\n]+)/);
    if (matchN) {
      name = `${matchN[1].trim()}, ${matchN[2].trim()}`.toLowerCase();
    } else {
      const matchFN = card.match(/FN(?:[^\n:]*)?:([^\n]+)/);
      if (matchFN) name = matchFN.group(1).trim().toLowerCase();
    }
    const matchTel = card.match(/TEL(?:[^\n:]*)?:([^\n\r]+)/);
    if (matchTel) tel = matchTel[1].replace(/\D/g, '');
    if (name && tel) map[name] = tel;
  });
  return map;
}

async function checkAndProcess() {
  if (!pdfDoc) return;
  say('Elaborazione delle schede in corso…');
  $('results').innerHTML = '';

  for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
    const page = await pdfDoc.getPage(pageNum);
    const textContent = await page.getTextContent();
    const rawText = textContent.items.map(i => i.str).join(' ');

    const data = parseCardText(rawText);
    if (!data.nome) continue;

    // Generazione immagine da pagina PDF
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    const imgDataUrl = canvas.toDataURL('image/png');

    // Cerca telefono
    const keyNome = data.nome.toLowerCase();
    const phone = rubrica[keyNome] || '';

    renderCard(data, phone, imgDataUrl, pageNum);
  }
  say('Elaborazione completata!');
}

function parseCardText(text) {
  const getMatch = (regex) => {
    const m = text.match(regex);
    return m ? m[1].trim() : '';
  };
  return {
    nome: getMatch(/Nome:\s*([^Assistente|Data]+)/i),
    assistente: getMatch(/Assistente:\s*([^Data|Parte]+)/i),
    data: getMatch(/Data:\s*([^Parte|Dove]+)/i),
    parte: getMatch(/Parte n\.:\s*(\d+)/i),
    luogo: getMatch(/Dove svolgerla::\s*([^Nota]+)/i) || 'Sala principale'
  };
}

function renderCard(data, phone, imgDataUrl, pageNum) {
  const container = document.createElement('div');
  container.className = 'item';

  const firstName = data.nome.includes(',') ? data.nome.split(',')[1].trim() : data.nome;
  const msg = `Ciao ${firstName}! 😊 Ti invio i dettagli della tua parte per l’adunanza Vita cristiana e ministero del ${data.data}. Parte n. ${data.parte} — ${data.luogo}.`;
  
  const waUrl = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;

  container.innerHTML = `
    <div class="item-header">📌 ${data.nome}</div>
    <div class="item-sub">
      ${data.assistente ? '<b>Assistente:</b> ' + data.assistente + '<br>' : ''}
      <b>Data:</b> ${data.data} | <b>Parte n.:</b> ${data.parte}<br>
      <b>Telefono:</b> ${phone ? '+' + phone : '⚠️ Non trovato in rubrica'}
    </div>
    <img src="${imgDataUrl}" class="preview-img" alt="Scheda ${pageNum}">
    <a href="${waUrl}" target="_blank" class="btn">💬 Apri in WhatsApp</a>
  `;
  $('results').appendChild(container);
}
</script>
</body>
</html>
